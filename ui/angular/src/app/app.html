<div class="app-container" [class.resizing]="resizing">
  <app-toolbar class="app-toolbar"></app-toolbar>

  <div class="app-main">
    <div class="left-panel" [style.width.px]="ui.leftPanelWidth()">
      <div class="panel-tabs">
        <button [class.active]="ui.leftPanelTab() === 'files'" (click)="ui.leftPanelTab.set('files')">Files</button>
        <button [class.active]="ui.leftPanelTab() === 'tasks'" (click)="ui.leftPanelTab.set('tasks')">Tasks</button>
        <button [class.active]="ui.leftPanelTab() === 'resources'" (click)="ui.leftPanelTab.set('resources')">Resources</button>
        <button [class.active]="ui.leftPanelTab() === 'accounts'" (click)="ui.leftPanelTab.set('accounts')">Accounts</button>
      </div>
      <div class="panel-content">
        <app-file-explorer [hidden]="ui.leftPanelTab() !== 'files'"></app-file-explorer>
        <app-task-tree [hidden]="ui.leftPanelTab() !== 'tasks'"></app-task-tree>
        <app-resource-tree [hidden]="ui.leftPanelTab() !== 'resources'"></app-resource-tree>
        <app-account-tree [hidden]="ui.leftPanelTab() !== 'accounts'"></app-account-tree>
      </div>
    </div>

    <div class="resize-handle vertical" (mousedown)="startResizeLeft($event)"></div>

    <div class="right-panel">
      <div class="panel-tabs">
        <button [class.active]="ui.rightPanelMode() === 'editor'" (click)="ui.rightPanelMode.set('editor')">Editor</button>
        <button [class.active]="ui.rightPanelMode() === 'gantt'" (click)="ui.rightPanelMode.set('gantt')">Gantt</button>
        <button [class.active]="ui.rightPanelMode() === 'report'" (click)="ui.rightPanelMode.set('report')">Reports</button>
        <button [class.active]="ui.rightPanelMode() === 'montecarlo'" (click)="ui.rightPanelMode.set('montecarlo')">Monte Carlo</button>
      </div>
      <div class="panel-content">
        <app-editor-pane [hidden]="ui.rightPanelMode() !== 'editor'"></app-editor-pane>
        <app-gantt-chart [hidden]="ui.rightPanelMode() !== 'gantt'"></app-gantt-chart>
        <app-report-viewer [hidden]="ui.rightPanelMode() !== 'report'"></app-report-viewer>
        <app-monte-carlo [hidden]="ui.rightPanelMode() !== 'montecarlo'"></app-monte-carlo>
      </div>
    </div>
  </div>

  @if (ui.messagePanelVisible()) {
    <div class="resize-handle horizontal" (mousedown)="startResizeBottom($event)"></div>
    <app-message-panel class="message-panel" [style.height.px]="ui.messagePanelHeight()"></app-message-panel>
  }
</div>
